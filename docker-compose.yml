services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hyperrisk
      POSTGRES_USER: hyperrisk
      POSTGRES_PASSWORD: hyperrisk
    ports: ['5432:5432']
    volumes: ['hyperrisk-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hyperrisk -d hyperrisk']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://hyperrisk:hyperrisk@postgres:5432/hyperrisk
      CORS_ORIGINS: http://localhost:8787
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  seed:
    build: ./backend
    command: ['python', '-m', 'hyperrisk.seed']
    environment:
      DATABASE_URL: postgresql+asyncpg://hyperrisk:hyperrisk@postgres:5432/hyperrisk
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ['8787:8787']
    depends_on:
      api: { condition: service_healthy }

volumes:
  hyperrisk-postgres:
